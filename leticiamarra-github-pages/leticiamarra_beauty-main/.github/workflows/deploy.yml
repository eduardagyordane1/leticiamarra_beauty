name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar pnpm
        run: npm install --global pnpm@10.4.1
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar TypeScript
        run: pnpm check
      - name: Gerar site estatico
        run: pnpm build:pages
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Enviar site gerado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
