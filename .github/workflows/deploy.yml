name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install
        working-directory: leticia-marra-beauty-site-completo/leticia-marra-beauty-site

      - name: Build site
        run: pnpm build
        working-directory: leticia-marra-beauty-site-completo/leticia-marra-beauty-site
        env:
          VITE_BASE: '/leticiamarra_beauty/'

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./leticiamarra_beauty-site-completo/leticia-marra-beauty-site/dist/public
